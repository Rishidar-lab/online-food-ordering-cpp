<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} &middot; Admin &middot; {{system_name}}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="/public/css/style.css">
  <link rel="icon" href="/public/img/placeholder.svg">
</head>
<body class="admin">
  <aside class="admin-sidebar">
    <div class="admin-brand">{{system_name}}<small>Administration</small></div>
    <nav class="admin-nav">
      <a href="/admin" class="{{active_dashboard}}">Dashboard</a>
      <a href="/admin/orders" class="{{active_orders}}">Orders</a>
      <a href="/admin/products" class="{{active_products}}">Products</a>
      <a href="/admin/categories" class="{{active_categories}}">Categories</a>
      <a href="/admin/users" class="{{active_users}}">Users</a>
      <a href="/admin/settings" class="{{active_settings}}">Settings</a>
    </nav>
    <div class="admin-foot">
      <a href="/" class="muted">&larr; View store</a>
      <a href="/admin/logout" class="btn btn-sm btn-danger">Logout</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="nav-toggle" onclick="document.body.classList.toggle('admin-open')">&#9776;</button>
      <h1>{{title}}</h1>
    </header>
    <div class="admin-content">
      {{&content}}
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/public/js/admin.js"></script>
</body>
</html>
