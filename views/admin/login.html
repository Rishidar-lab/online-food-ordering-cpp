<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login &middot; {{system_name}}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="/public/css/style.css">
</head>
<body class="admin-login-body">
  <div class="auth-card admin-login-card">
    <h1>Administration</h1>
    <p class="muted">{{system_name}}</p>
    <div class="alert alert-error">{{error}}</div>
    <form method="post" action="/admin/login" class="form">
      <label>Username<input type="text" name="username" required autofocus></label>
      <label>Password<input type="password" name="password" required></label>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-alt"><a href="/">&larr; Back to store</a></p>
    <p class="muted small">Default seed account: <code>admin</code> / <code>admin123</code></p>
  </div>
</body>
</html>
