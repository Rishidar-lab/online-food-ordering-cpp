<section class="hero hero-sm" style="--cover:url('{{&cover_url}}')">
  <div class="container hero-inner"><div class="hero-text"><h1>About Us</h1></div></div>
</section>

<section class="container section about">
  <div class="about-grid">
    <div>
      <h2 class="section-title">{{system_name}}</h2>
      <p>{{about_us}}</p>
      <p>This ordering portal lets you browse the full menu with prices, keep a
         running cart and place orders online — no phone calls or paper slips.</p>
    </div>
    <aside class="about-card">
      <h4>Visit / Contact</h4>
      <p><strong>Address</strong><br>{{address}}</p>
      <p><strong>Phone</strong><br>{{contact_phone}}</p>
      <p><strong>Email</strong><br>{{contact_email}}</p>
      <a class="btn btn-primary" href="/menu">Start your order</a>
    </aside>
  </div>
</section>
